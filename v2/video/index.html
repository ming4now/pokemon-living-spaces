<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雪境的一天 · 冰系宝可梦房间</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101e2d;color:#e5edf4;font:16px/1.6 system-ui,"Noto Sans CJK SC",sans-serif;padding:38px 5vw}main{max-width:1440px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}h1{margin:0;font-size:clamp(22px,3vw,34px);font-weight:550;letter-spacing:.07em}p{margin:6px 0 0;color:#a9c0d2;font-size:14px}video{width:100%;display:block;aspect-ratio:16/9;background:#08131d;border-radius:16px;box-shadow:0 18px 65px #0005}a{color:#c6e3f7;text-decoration:none;border-bottom:1px solid #55748a;padding-bottom:3px}footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:18px;font-size:14px;color:#9ab3c6}.hint{font-size:13px;letter-spacing:.04em}@media(max-width:600px){body{padding:22px 14px}header{align-items:flex-start;flex-direction:column;gap:8px}video{border-radius:9px}}
</style>
<main>
 <header><div><h1>雪境的一天</h1><p>冰系宝可梦房间 · 清晨 06:00 → 次日清晨 06:00</p></div><span class="hint" id="hint">正在准备视频…</span></header>
 <video id="film" controls playsinline preload="auto" poster="ice_24h_poster.jpg">浏览器暂不支持播放，请下载 MP4 视频。</video>
 <footer><span>01:36 · 1080p · 原创静谧配乐</span><a href="ice_24h_with_bgm.mp4" download>下载视频 MP4</a></footer>
</main>
<script>
(async()=>{
 const film=document.getElementById('film'),hint=document.getElementById('hint');
 const path='ice_24h_with_bgm.mp4';let objectURL;
 try{
  // The local static preview server does not implement HTTP byte ranges.
  // A complete Blob gives the video element a seekable local media source.
  if(location.protocol==='http:'||location.protocol==='https:'){
   const response=await fetch(path);if(!response.ok)throw new Error('video');
   objectURL=URL.createObjectURL(await response.blob());film.src=objectURL;
  }else film.src=path;
  film.addEventListener('loadeddata',()=>{hint.textContent='打开声音，听雪夜里的轻柔和声';},{once:true});
  window.addEventListener('pagehide',()=>{if(objectURL)URL.revokeObjectURL(objectURL);},{once:true});
 }catch(error){hint.textContent='视频暂未载入，可点击下方下载';film.src=path;}
})();
</script>
</html>
